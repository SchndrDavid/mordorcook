  --bg:              #F2F2F7;

  --dur-fast: 180ms;
  --dur: 280ms;

  --safe-t: env(safe-area-inset-top, 0px);

/* Dark appearance: applied by system preference unless the user pinned

@media (prefers-color-scheme: dark) {
  :root:not([data-appearance="light"]) { color-scheme: dark; }
}
:root[data-appearance="dark"] { color-scheme: dark; }

<style>
/* ==========================================================================
   Base
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }

html {
  /* The text size preference scales the whole type ramp at once, up to 200%. */
  font-size: calc(100% * var(--text-scale, 1));
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text",
               "Segoe UI", system-ui, "Helvetica Neue", sans-serif;
  font-size: var(--t-body);
  line-height: var(--lh-body);
  color: var(--label);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overscroll-behavior-y: none;
}

h1, h2, h3, h4, p, figure, blockquote { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--tint); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Every interactive element keeps a visible focus ring for keyboard and
   switch-control users; pointer interaction does not show it. */
:focus-visible {
  outline: 3px solid var(--tint);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

.visually-hidden {
  position: absolute; width: 1px; height: 1px; margin: -1px;
  padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* Type styles ------------------------------------------------------------ */
.t-largetitle { font-size: var(--t-largetitle); line-height: var(--lh-largetitle); font-weight: 700; letter-spacing: -0.02em; }
.t-title1     { font-size: var(--t-title1);     line-height: var(--lh-title1);     font-weight: 700; letter-spacing: -0.015em; }
.t-title2     { font-size: var(--t-title2);     line-height: var(--lh-title2);     font-weight: 700; letter-spacing: -0.01em; }
.t-title3     { font-size: var(--t-title3);     line-height: var(--lh-title3);     font-weight: 600; }
.t-headline   { font-size: var(--t-headline);   line-height: var(--lh-headline);   font-weight: 600; }
.t-body       { font-size: var(--t-body);       line-height: var(--lh-body);       font-weight: 400; }
.t-callout    { font-size: var(--t-callout);    line-height: var(--lh-callout);    font-weight: 400; }
.t-subhead    { font-size: var(--t-subhead);    line-height: var(--lh-subhead);    font-weight: 400; }
.t-footnote   { font-size: var(--t-footnote);   line-height: var(--lh-footnote);   font-weight: 400; }
.t-caption    { font-size: var(--t-caption);    line-height: var(--lh-caption);    font-weight: 400; }
.secondary { color: var(--label-secondary); }
.tertiary  { color: var(--label-tertiary); }
.tabular   { font-variant-numeric: tabular-nums; }

/* Motion ----------------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
:root[data-motion="reduce"] *, :root[data-motion="reduce"] *::before, :root[data-motion="reduce"] *::after {
  animation-duration: 0.01ms !important;
  transition-duration: 0.01ms !important;
}

/* Liquid Glass ------------------------------------------------------------
   Reserved for the functional layer only: the top bar, the tab bar, the
   floating timer and the primary cook button. Content never uses it. */
.glass {
  background: var(--glass-tint);
  -webkit-backdrop-filter: blur(30px) saturate(1.4);
  backdrop-filter: blur(30px) saturate(1.4);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass { background: var(--glass-solid); }
}
/* Honour Reduce Transparency: translucency is decoration, legibility is not. */
@media (prefers-reduced-transparency: reduce) {
  .glass { background: var(--glass-solid); -webkit-backdrop-filter: none; backdrop-filter: none; }
}
:root[data-transparency="reduce"] .glass {
  background: var(--glass-solid); -webkit-backdrop-filter: none; backdrop-filter: none;
}
</style>
<style>
/* ==========================================================================
   Shell: top bar, tab bar (compact) / sidebar (regular width)
   ========================================================================== */
#app { min-height: 100dvh; }

.topbar {
  position: fixed; inset: 0 0 auto 0; z-index: 40;
  display: flex; align-items: center; gap: var(--sp-2);
  padding: var(--safe-t) calc(var(--gutter) + var(--safe-r)) 0 calc(var(--gutter) + var(--safe-l));
  min-height: calc(var(--topbar-h) + var(--safe-t));
  border-bottom: 0.5px solid transparent;
  transition: border-color var(--dur-fast) linear, background-color var(--dur-fast) linear;
}
/* Scroll edge effect: the bar only separates itself from content once
   content actually slides underneath it. */
.topbar:not(.is-scrolled) { background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
.topbar.is-scrolled { border-bottom-color: var(--separator); }

.topbar__title {
  flex: 1; min-width: 0;
  font-size: var(--t-headline); line-height: var(--lh-headline); font-weight: 600;
  text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  opacity: 0; transform: translateY(6px);
  transition: opacity var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.topbar.is-scrolled .topbar__title { opacity: 1; transform: none; }
.topbar__side { display: flex; align-items: center; gap: var(--sp-1); flex: 0 0 auto; min-width: 44px; }
.topbar__side--end { justify-content: flex-end; }

.main {
  padding-top: calc(var(--topbar-h) + var(--safe-t));
  padding-bottom: calc(var(--tabbar-h) + var(--safe-b) + var(--sp-6));
  padding-left: var(--safe-l); padding-right: var(--safe-r);
}
.wrap { max-width: var(--content-max); margin: 0 auto; padding: 0 var(--gutter); }
.wrap--wide { max-width: 68rem; }

.largetitle {
  padding: var(--sp-2) 0 var(--sp-4);
  font-size: var(--t-largetitle); line-height: var(--lh-largetitle);
  font-weight: 700; letter-spacing: -0.02em;
}

.tabbar {
  position: fixed; inset: auto 0 0 0; z-index: 40;
  display: flex; justify-content: space-around; align-items: stretch;
  padding: 0 var(--safe-r) var(--safe-b) var(--safe-l);
  min-height: calc(var(--tabbar-h) + var(--safe-b));
  border-top: 0.5px solid var(--separator);
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; min-height: var(--tap); padding: var(--sp-1) var(--sp-2);
  color: var(--label-secondary); font-size: 11px; line-height: 1.1; font-weight: 500;
  transition: color var(--dur-fast) var(--ease);
}
.tab .icon { width: 1.6em; height: 1.6em; }
/* Selected state is carried by colour, weight and a filled icon, so it does
   not depend on colour perception alone. */
.tab[aria-current="page"] { color: var(--tint); font-weight: 600; }
.tab[aria-current="page"] .icon { stroke-width: 2.5; }
.tab:hover { color: var(--label); }
.tab[aria-current="page"]:hover { color: var(--tint); }

.sidebar { display: none; }

@media (min-width: 900px) {
  /* Regular width follows the desktop convention: a sidebar rather than a
     bottom tab bar, and the content column stays comfortably readable. */
  .tabbar { display: none; }
  .sidebar {
    position: fixed; inset: 0 auto 0 0; z-index: 45; width: 15rem;
    display: flex; flex-direction: column; gap: var(--sp-1);
    padding: calc(var(--safe-t) + var(--sp-5)) var(--sp-3) var(--sp-4) calc(var(--sp-3) + var(--safe-l));
    border-right: 0.5px solid var(--separator);
  }
  .sidebar__brand {
    display: flex; align-items: center; gap: var(--sp-2);
    padding: 0 var(--sp-3) var(--sp-5);
    font-size: var(--t-title3); font-weight: 700; letter-spacing: -0.01em;
  }
  .sidebar .tab {
    flex: 0 0 auto; flex-direction: row; justify-content: flex-start; gap: var(--sp-3);
    padding: var(--sp-2) var(--sp-3); border-radius: var(--r-md);
    font-size: var(--t-body); font-weight: 500;
  }
  .sidebar .tab .icon { width: 1.35em; height: 1.35em; }
  .sidebar .tab[aria-current="page"] { background: var(--tint-soft); }
  .sidebar .tab:hover { background: var(--fill-4); }
  .sidebar .tab[aria-current="page"]:hover { background: var(--tint-soft); }
  .topbar { left: 15rem; }
  .main { padding-left: 15rem; padding-bottom: var(--sp-8); }
  .main .wrap { padding-left: var(--sp-6); padding-right: var(--sp-6); }
}
</style>
<style>
/* ==========================================================================
   Controls
   Every control clears the 44px comfortable minimum on touch.
   ========================================================================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  min-height: var(--tap); padding: 0 var(--sp-5); border-radius: var(--r-full);
  font-size: var(--t-headline); font-weight: 600; color: var(--tint);
  transition: transform var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease),
              opacity var(--dur-fast) var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(0.97); }
.btn[disabled] { opacity: 0.4; pointer-events: none; }
.btn .icon { width: 1.15em; height: 1.15em; }

/* Only one filled action per screen carries the tint, so emphasis stays
   where it belongs. */
.btn--filled { background: var(--tint); color: var(--tint-on); }
.btn--filled:hover { background: var(--tint-pressed); }
.btn--tinted { background: var(--tint-soft); }
.btn--tinted:hover { background: color-mix(in srgb, var(--tint) 22%, transparent); }
.btn--gray { background: var(--fill-3); color: var(--label); }
.btn--gray:hover { background: var(--fill-2); }
.btn--plain { padding: 0 var(--sp-2); }
.btn--plain:hover { background: var(--fill-4); }
.btn--danger { color: var(--destructive); }
.btn--danger.btn--filled { background: var(--destructive); color: #FFFFFF; }
.btn--block { width: 100%; }
.btn--large { min-height: 52px; font-size: var(--t-title3); }

.iconbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: var(--tap); height: var(--tap); border-radius: var(--r-full);
  color: var(--tint); flex: 0 0 auto;
  transition: background-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.iconbtn:hover { background: var(--fill-4); }
.iconbtn:active { transform: scale(0.92); }
.iconbtn .icon { width: 1.4em; height: 1.4em; }
.iconbtn--neutral { color: var(--label-secondary); }
.iconbtn--danger { color: var(--destructive); }

.icon { width: 1em; height: 1em; display: block; fill: none; stroke: currentColor;
        stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon--filled { fill: currentColor; stroke: none; }

/* Inset grouped list ----------------------------------------------------- */
.group { margin: 0 0 var(--sp-6); }
.group__header {
  padding: 0 var(--sp-4) var(--sp-2);
  font-size: var(--t-footnote); line-height: var(--lh-footnote);
  font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--label-secondary);
}
.group__footer {
  padding: var(--sp-2) var(--sp-4) 0;
  font-size: var(--t-footnote); line-height: var(--lh-footnote); color: var(--label-secondary);
}
.list { background: var(--bg-card); border-radius: var(--r-lg); overflow: hidden; }
.row {
  display: flex; align-items: center; gap: var(--sp-3);
  width: 100%; min-height: var(--tap); padding: var(--sp-3) var(--sp-4);
  text-align: left; color: inherit;
  transition: background-color var(--dur-fast) var(--ease);

<script>
/* Classic scripts sharing one global lexical scope: every block below is a
   complete program, so the file can be read section by section. */
"use strict";

/* ==========================================================================
   Small helpers
   Nodes are built rather than assembled from HTML strings, so recipe text
   the user typed can never be interpreted as markup.
   ========================================================================== */
const SVG_NS = "http://www.w3.org/2000/svg";

function append(parent, child) {
  if (child === null || child === undefined || child === false) return;
  if (Array.isArray(child)) { child.forEach(function (c) { append(parent, c); }); return; }
  parent.appendChild(child.nodeType ? child : document.createTextNode(String(child)));
}

function el(tag, props, children) {
  const node = document.createElement(tag);
  if (props) {
    Object.keys(props).forEach(function (key) {
      const value = props[key];
      if (value === null || value === undefined || value === false) return;
      if (key === "class") node.className = value;
      else if (key === "text") node.textContent = value;
      else if (key === "dataset") Object.assign(node.dataset, value);
      else if (key.slice(0, 2) === "on") node.addEventListener(key.slice(2).toLowerCase(), value);
      else node.setAttribute(key, value === true ? "" : value);
    });
  }
  append(node, children);
  return node;
}

function icon(name, cls) {
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("class", cls ? "icon " + cls : "icon");
  svg.setAttribute("aria-hidden", "true");
  svg.setAttribute("focusable", "false");
  const use = document.createElementNS(SVG_NS, "use");
  use.setAttribute("href", "#i-" + name);
  svg.appendChild(use);
  return svg;
}

const $ = function (sel, root) { return (root || document).querySelector(sel); };
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
function setContent(node, children) { clear(node); append(node, children); }

/* ------------------------------------------------------------------ API -- */
// Derived at run time so the app also works when served under a sub-path.
const BASE = location.pathname.replace(/[^/]*$/, "") || "/";

async function api(path, options) {
  const opts = Object.assign({ headers: {} }, options);
  if (opts.body !== undefined && !(opts.body instanceof FormData)) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(opts.body);
  }
  const resp = await fetch(BASE + path, opts);
  if (!resp.ok) {
    let detail = "Request failed (" + resp.status + ")";
    try {
      const data = await resp.json();
      if (data && data.detail) detail = typeof data.detail === "string" ? data.detail : detail;
    } catch (err) { /* the body was not JSON; the status text is enough */ }
    throw new Error(detail);
  }
  return resp.status === 204 ? null : resp.json();
}

const photoUrl = function (id) { return BASE + "api/photos/" + id; };

/* ------------------------------------------------------------ formatting -- */
const FRACTIONS = [
  [1 / 8, "\u215B"], [1 / 4, "\u00BC"], [1 / 3, "\u2153"], [1 / 2, "\u00BD"],
  [2 / 3, "\u2154"], [3 / 4, "\u00BE"]
];

// Scaled amounts are shown the way a cook would write them: 1½ rather than 1.5.
function formatAmount(value) {
  if (value === null || value === undefined || isNaN(value)) return "";
  if (value === 0) return "0";
  const rounded = Math.round(value * 100) / 100;
  const whole = Math.floor(rounded);
  const rest = rounded - whole;
  if (rest < 0.02) return String(whole);
  for (let i = 0; i < FRACTIONS.length; i++) {
    if (Math.abs(rest - FRACTIONS[i][0]) < 0.04) {
      return (whole > 0 ? whole : "") + FRACTIONS[i][1];
    }
  }
  if (rounded < 10) return String(Math.round(rounded * 10) / 10);
  return String(Math.round(rounded));
}

function formatMinutes(total) {
  const mins = Math.max(0, Math.round(total || 0));
  if (!mins) return "";
  if (mins < 60) return mins + " min";
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m ? h + " h " + m + " min" : h + " h";
}

function formatClock(seconds) {
  const s = Math.max(0, Math.round(seconds));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  const pad = function (n) { return n < 10 ? "0" + n : String(n); };
  return h ? h + ":" + pad(m) + ":" + pad(sec) : m + ":" + pad(sec);
}

function formatDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
}

function formatBytes(n) {
  if (!n) return "0 kB";
  if (n < 1024 * 1024) return Math.round(n / 1024) + " kB";
  return (n / 1024 / 1024).toFixed(1) + " MB";
}

const plural = function (n, one, many) { return n + " " + (n === 1 ? one : many); };

<script>
/* ==========================================================================
   State and preferences
   Recipes, photos and the shopping list live on the server so that a phone
   and a desktop always agree. Only the things that are genuinely per-device
   are kept in this browser.
   ========================================================================== */
"use strict";

const PREF_KEY = "mordorcook.prefs";
const TIMER_KEY = "mordorcook.timers";
const CHECKED_KEY = "mordorcook.checked";
const COOKING_KEY = "mordorcook.cooking";

function readStore(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (err) {
    return fallback;   // private browsing, or a value from an older version
  }
}

function writeStore(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (err) { /* private mode */ }
}

const defaultPrefs = {
  appearance: "auto",     // auto | light | dark
  textScale: 1,
  reduceMotion: false,
  reduceTransparency: false,
  keepAwake: true,
  sound: true
};

function loadPrefs() {
  try {
    const raw = localStorage.getItem(PREF_KEY);
    return Object.assign({}, defaultPrefs, raw ? JSON.parse(raw) : {});
  } catch (err) {
    return Object.assign({}, defaultPrefs);
  }
}

function savePrefs() {
  try { localStorage.setItem(PREF_KEY, JSON.stringify(state.prefs)); } catch (err) { /* private mode */ }
  applyPrefs();
}

function applyPrefs() {
  const root = document.documentElement;
  root.setAttribute("data-appearance", state.prefs.appearance);
  root.style.setProperty("--text-scale", String(state.prefs.textScale));
  root.setAttribute("data-motion", state.prefs.reduceMotion ? "reduce" : "no-preference");
  root.setAttribute("data-transparency", state.prefs.reduceTransparency ? "reduce" : "no-preference");
}

const state = {
  recipes: [],
  shopping: [],
  loaded: false,
  filters: { q: "", tag: "", favorite: false, sort: "updated" },
  checked: readStore(CHECKED_KEY, {}),   // recipe id -> ticked ingredient indexes
  prefs: loadPrefs(),
  route: { name: "library", params: {} }
};

const findRecipe = function (id) {
  return state.recipes.filter(function (r) { return r.id === id; })[0] || null;
};

async function refreshRecipes() {
  state.recipes = await api("api/recipes?sort=" + encodeURIComponent(state.filters.sort));
  state.loaded = true;
}

async function refreshShopping() {
  state.shopping = await api("api/shopping");
}

function allTags() {
  const seen = {};
  state.recipes.forEach(function (r) {
    (r.tags || []).forEach(function (t) { seen[t] = true; });
    if (r.category) seen[r.category] = true;
  });
  return Object.keys(seen).sort();
}

/* ------------------------------------------------------------- feedback -- */
function toast(message, kind, action) {
  const host = $("#toasts");
  const dismiss = function () {
    node.style.transition = "opacity 200ms linear";
    node.style.opacity = "0";
    setTimeout(function () { node.remove(); }, 220);
  };
  const node = el("div", { class: "toast" + (kind ? " toast--" + kind : "") }, [
    kind === "error" ? icon("warn") : kind === "ok" ? icon("check") : icon("info"),
    el("span", { text: message, style: "flex:1" }),
    // An action here is what makes a destructive step recoverable rather than
    // merely announced.
    action ? el("button", {
      class: "btn btn--plain", type: "button", text: action.label,
      style: "min-height:32px;padding:0 4px;font-weight:700",
      onclick: function () { dismiss(); action.onAction(); }
    }) : null
  ]);
  host.appendChild(node);
  setTimeout(dismiss, action ? 8000 : kind === "error" ? 5200 : 3000);
}

function reportError(err) {
  toast(err && err.message ? err.message : "Something went wrong", "error");
}

// A short tap of haptic feedback where the platform offers it.
function haptic(pattern) {
  if (navigator.vibrate) { try { navigator.vibrate(pattern || 12); } catch (err) { /* ignore */ } }
}

/* ==========================================================================
   Sheets and dialogs
   ========================================================================== */
"use strict";

let sheetState = null;

function focusables(root) {
  return Array.prototype.slice.call(root.querySelectorAll(
    'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]),' +
    ' textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
  )).filter(function (n) { return n.offsetParent !== null || n === document.activeElement; });
}

function openSheet(options) {
  closeSheet(true);
  const sheet = $("#sheet");
  const scrim = $("#scrim");
  const restoreTo = document.activeElement;

  const head = el("div", { class: "sheet__head" }, [
    options.leading || el("button", {
      class: "btn btn--plain", type: "button", text: options.cancelLabel || "Cancel",
      onclick: function () { closeSheet(); }
    }),
    el("h2", { class: "sheet__title", id: "sheetTitle", text: options.title || "" }),
    options.trailing || el("span", { class: "topbar__side" })
  ]);
  const body = el("div", { class: "sheet__body" }, options.body);

  setContent(sheet, [el("div", { class: "sheet__grip" }), head, body,
    options.footer ? el("div", { class: "sheet__foot" }, options.footer) : null]);
  sheet.setAttribute("aria-labelledby", "sheetTitle");

  scrim.hidden = false;
  sheet.hidden = false;
  // Two frames so the transition has a start value to animate from.
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { scrim.classList.add("is-open"); sheet.classList.add("is-open"); });
  });

  sheetState = { restoreTo: restoreTo, onClose: options.onClose };
  const first = focusables(sheet)[options.focusIndex || 0];
  if (first) setTimeout(function () { first.focus(); }, 60);
  return body;
}

function closeSheet(immediate) {
  const sheet = $("#sheet");
  const scrim = $("#scrim");
  if (sheet.hidden) return;
  const previous = sheetState;
  sheetState = null;
  sheet.classList.remove("is-open");
  scrim.classList.remove("is-open");
  const finish = function () {
    sheet.hidden = true;
    scrim.hidden = true;
    clear(sheet);
    if (previous && previous.restoreTo && previous.restoreTo.isConnected) previous.restoreTo.focus();
    if (previous && previous.onClose) previous.onClose();
  };
  if (immediate) finish(); else setTimeout(finish, 300);
}

// A confirmation step for anything that destroys work, as the guidelines ask
// for destructive actions.
function confirmAction(options) {
  return new Promise(function (resolve) {
    let settled = false;
    const done = function (value) {
      if (settled) return;
      settled = true;
      resolve(value);
      closeSheet();
    };
    openSheet({
      title: options.title,
      cancelLabel: "Cancel",
      onClose: function () { done(false); },
      body: el("p", { class: "t-callout secondary", text: options.message,
                      style: "padding:8px 4px 20px" }),
      footer: el("div", { class: "stack" }, [
        el("button", {
          class: "btn btn--filled btn--block" + (options.destructive ? " btn--danger" : ""),
          type: "button", text: options.confirmLabel || "Confirm",
          onclick: function () { done(true); }
        }),
        el("button", { class: "btn btn--gray btn--block", type: "button", text: "Cancel",
                       onclick: function () { done(false); } })
      ])
    });
  });
}

$("#scrim").addEventListener("click", function () { closeSheet(); });

document.addEventListener("keydown", function (event) {
  if (event.key !== "Escape") return;
  if (!$("#sheet").hidden) { closeSheet(); return; }
  if ($("#cook").classList.contains("is-open")) closeCook();
});

// Keep focus inside whichever modal surface is open.
document.addEventListener("focusin", function (event) {
  const sheet = $("#sheet");
  if (!sheet.hidden) {
    if (sheet.contains(event.target)) return;
    const list = focusables(sheet);
    if (list.length) list[0].focus();
    return;
  }
  const cook = $("#cook");
  if (cook.classList.contains("is-open") && !cook.contains(event.target)) {
    const list = focusables(cook);
    if (list.length) list[0].focus();
  }
});

   Navigation shell

"use strict";

const TABS = [
  { id: "library",  route: "#/recipes",  label: "Recipes",  icon: "book" },
  { id: "shopping", route: "#/shopping", label: "Shopping", icon: "cart" },
  { id: "timers",   route: "#/timers",   label: "Timers",   icon: "timer" },
  { id: "settings", route: "#/settings", label: "Settings", icon: "gear" }
];

function tabOf(routeName) {
  if (routeName === "recipe" || routeName === "editor") return "library";
  return routeName;
}

function renderTabs() {
  const current = tabOf(state.route.name);
  const build = function (host) {
    setContent(host, TABS.map(function (tab) {
      const active = tab.id === current;
      return el("a", {
        class: "tab", href: tab.route,
        "aria-current": active ? "page" : null
      }, [icon(tab.icon), el("span", { text: tab.label })]);
    }));
  };
  build($("#tabbar"));
  build($("#sidebarNav"));
}

function setTopbar(options) {
  const start = $("#topbarStart");
  const end = $("#topbarEnd");
  $("#topbarTitle").textContent = options.title || "";
  setContent(start, options.leading || null);
  setContent(end, options.trailing || null);
}

function backButton(href, label) {
  return el("a", { class: "iconbtn", href: href, "aria-label": label || "Back" }, icon("back"));
}

/* The top bar only grows a background and a separator once content has
   actually scrolled under it. */
function watchScroll() {
  const bar = $("#topbar");
  let ticking = false;
  const update = function () {
    bar.classList.toggle("is-scrolled", window.scrollY > 8);
    ticking = false;
  };
  window.addEventListener("scroll", function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(update);
  }, { passive: true });
  update();
}

/* -------------------------------------------------------------- router -- */
function parseRoute() {
  const raw = location.hash.replace(/^#\/?/, "");
  const parts = raw.split("/").filter(Boolean);
  if (!parts.length) return { name: "library", params: {} };
  const head = parts[0];
  if (head === "recipes") return { name: "library", params: {} };
  if (head === "recipe" && parts[1]) return { name: "recipe", params: { id: parts[1] } };
  if (head === "new") return { name: "editor", params: { id: null } };
  if (head === "edit" && parts[1]) return { name: "editor", params: { id: parts[1] } };
  if (head === "cook" && parts[1]) return { name: "cook", params: { id: parts[1] } };
  if (head === "shopping") return { name: "shopping", params: {} };
  if (head === "timers") return { name: "timers", params: {} };
  if (head === "settings") return { name: "settings", params: {} };
  return { name: "library", params: {} };
}

const VIEWS = {};

async function render() {
  const route = parseRoute();
  const previous = state.route;
  state.route = route;

  // Cooking mode is an overlay rather than a page, so it opens and closes
  // without tearing down whatever is underneath it.
  if (route.name === "cook") {
    renderTabs();
    if (!state.loaded) { try { await refreshRecipes(); } catch (err) { reportError(err); } }
    openCook(route.params.id);
    return;
  }
  if ($("#cook").classList.contains("is-open")) closeCook(true);

  renderTabs();
  if (route.name !== "editor") navGuard = null;
  const main = $("#main");
  const view = VIEWS[route.name] || VIEWS.library;
  const sameView = previous && previous.name === route.name && previous.params.id === route.params.id;
  if (!sameView) window.scrollTo(0, 0);

  try {
    await view(main, route.params);
  } catch (err) {
    reportError(err);
    setContent(main, el("div", { class: "wrap" }, el("div", { class: "empty" }, [
      icon("warn"),
      el("p", { class: "empty__title", text: "Could not load this" }),
      el("p", { class: "empty__body", text: err.message })
    ])));
  }
  $("#topbar").classList.toggle("is-scrolled", window.scrollY > 8);
}

function go(hash, replace) {
  if (replace) location.replace(hash);
  else location.hash = hash;
}

/* A view with unsaved work registers a guard here, so leaving by the tab bar
   or the browser's back button asks first instead of discarding silently. */
let navGuard = null;

window.addEventListener("hashchange", async function () {
  if (navGuard && navGuard.isDirty() && location.hash !== navGuard.hash) {
    const target = location.hash;
    // Put the address back without firing another hashchange, so declining
    // leaves the half-written recipe exactly as it was.
    history.replaceState(null, "", navGuard.hash);
    const ok = await confirmAction({
      title: "Discard changes?",
      message: "The edits you made to this recipe will not be saved.",
      confirmLabel: "Discard", destructive: true
    });
    if (!ok) return;
    navGuard = null;
    location.hash = target;
    return;
  }
  render();
});

window.addEventListener("beforeunload", function (event) {
  if (!navGuard || !navGuard.isDirty()) return;
  event.preventDefault();
  event.returnValue = "";
});

function loadingView() {
  return el("div", { class: "loading" }, [el("div", { class: "spinner" }), el("span", { text: "Loading" })]);
}

<script>
/* ==========================================================================
   Timers
   Timers are stored as an absolute end time, so they stay correct while the
   tab is backgrounded, the screen is off, or the page is reloaded.
   ========================================================================== */
"use strict";

let timers = [];
let audioContext = null;
let alarmTimer = null;

function loadTimers() {
  try {
    const raw = localStorage.getItem(TIMER_KEY);
    timers = raw ? JSON.parse(raw) : [];
  } catch (err) { timers = []; }
  const now = Date.now();
  timers.forEach(function (t) {
    if (!t.paused && t.endsAt <= now) t.done = true;
  });
}

function persistTimers() {
  try { localStorage.setItem(TIMER_KEY, JSON.stringify(timers)); } catch (err) { /* private mode */ }
}

function timerRemaining(t) {
  if (t.done) return 0;
  if (t.paused) return t.remaining;
  return Math.max(0, (t.endsAt - Date.now()) / 1000);
}

function addTimer(options) {
  const seconds = Math.max(1, Math.round(options.seconds));
  const timer = {
    id: "t" + Date.now() + Math.random().toString(36).slice(2, 7),
    label: options.label || "Timer",
    duration: seconds,
    endsAt: Date.now() + seconds * 1000,
    paused: false,
    remaining: seconds,
    done: false,
    recipeId: options.recipeId || null,
    stepIndex: typeof options.stepIndex === "number" ? options.stepIndex : null
  };
  timers.push(timer);
  persistTimers();
  unlockAudio();
  requestNotifications();
  updateTimerViews();
  return timer;
}

function findTimer(id) { return timers.filter(function (t) { return t.id === id; })[0] || null; }

function toggleTimer(id) {
  const t = findTimer(id);
  if (!t || t.done) return;
  if (t.paused) {
    t.paused = false;
    t.endsAt = Date.now() + t.remaining * 1000;
  } else {
    t.paused = true;
    t.remaining = timerRemaining(t);
  }
  persistTimers();
  updateTimerViews();
}

function resetTimer(id) {
  const t = findTimer(id);
  if (!t) return;
  t.done = false;
  t.paused = false;
  t.remaining = t.duration;
  t.endsAt = Date.now() + t.duration * 1000;
  persistTimers();
  stopAlarmIfIdle();
  updateTimerViews();
}

function removeTimer(id) {
  timers = timers.filter(function (t) { return t.id !== id; });
  persistTimers();
  stopAlarmIfIdle();
  updateTimerViews();
}

function dismissTimer(id) { removeTimer(id); }

/* ---------------------------------------------------------------- alarm -- */
function unlockAudio() {
  if (audioContext || !state.prefs.sound) return;
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return;
  try {
    audioContext = new Ctor();
    if (audioContext.state === "suspended") audioContext.resume();
  } catch (err) { audioContext = null; }
}

function beep() {
  if (!state.prefs.sound || !audioContext) return;
  const now = audioContext.currentTime;
  [0, 0.28, 0.56].forEach(function (offset) {
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, now + offset);
    gain.gain.setValueAtTime(0.0001, now + offset);
    gain.gain.exponentialRampToValueAtTime(0.28, now + offset + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.22);
    osc.connect(gain).connect(audioContext.destination);
    osc.start(now + offset);
    osc.stop(now + offset + 0.24);
  });
}

function requestNotifications() {
  if (!("Notification" in window) || Notification.permission !== "default") return;
  try { Notification.requestPermission(); } catch (err) { /* older browsers */ }
}

function fireTimer(timer) {
  timer.done = true;
  timer.paused = false;
  persistTimers();
  haptic([220, 120, 220, 120, 320]);
  beep();
  if (alarmTimer) clearInterval(alarmTimer);
  // Keep sounding until it is acknowledged; a pot does not stop boiling
  // because a single beep was missed.
  alarmTimer = setInterval(beep, 3000);
  if ("Notification" in window && Notification.permission === "granted") {
    try {
      new Notification(timer.label, { body: "Timer finished", tag: timer.id, renotify: true });
    } catch (err) { /* not supported in this context */ }
  }
  toast(timer.label + " \u2014 time is up", "ok");
}

function stopAlarmIfIdle() {
  const anyDone = timers.some(function (t) { return t.done; });
  if (!anyDone && alarmTimer) { clearInterval(alarmTimer); alarmTimer = null; }
}
</script>
<script>
/* Timer tick: one loop drives every countdown on screen. */
"use strict";

function updateTimerViews() {
  // Live countdowns anywhere in the document.
  Array.prototype.forEach.call(document.querySelectorAll("[data-timer-time]"), function (node) {
    const timer = findTimer(node.getAttribute("data-timer-time"));
    if (!timer) return;
    node.textContent = timer.done ? "Done" : formatClock(timerRemaining(timer));
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-timer-card]"), function (node) {
    const timer = findTimer(node.getAttribute("data-timer-card"));
    if (timer) node.classList.toggle("is-done", !!timer.done);
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-timer-toggle]"), function (node) {
    const timer = findTimer(node.getAttribute("data-timer-toggle"));
    if (!timer) return;
    const label = timer.paused ? "Resume" : "Pause";
    setContent(node, icon(timer.paused ? "play" : "pause"));
    node.setAttribute("aria-label", label + " " + timer.label);
    node.hidden = !!timer.done;
  });
  updatePill();
  if (state.route.name === "timers") renderTimerList();
}

function pillTimer() {
  const done = timers.filter(function (t) { return t.done; });
  if (done.length) return done[0];
  const running = timers.filter(function (t) { return !t.paused; });
  running.sort(function (a, b) { return a.endsAt - b.endsAt; });
  if (running.length) return running[0];
  return timers[0] || null;
}

function updatePill() {
  const pill = $("#timerPill");
  const timer = pillTimer();
  const inCook = $("#cook").classList.contains("is-open");
  if (!timer || inCook || state.route.name === "timers") {
    pill.hidden = true;
    pill.classList.remove("is-visible");
    return;
  }
  pill.hidden = false;
  pill.classList.add("is-visible");
  pill.classList.toggle("is-done", !!timer.done);
  $("#timerPillTime").textContent = timer.done ? "Done" : formatClock(timerRemaining(timer));
  $("#timerPillLabel").textContent = timer.label;
  pill.setAttribute("aria-label",
    timer.done ? timer.label + ", finished. Open timers." : timer.label + ", " +
    formatClock(timerRemaining(timer)) + " remaining. Open timers.");
}

function tick() {
  let changed = false;
  timers.forEach(function (t) {
    if (!t.done && !t.paused && timerRemaining(t) <= 0) { fireTimer(t); changed = true; }
  });
  updateTimerViews();
  if (changed) persistTimers();
}

setInterval(tick, 250);

$("#timerPill").addEventListener("click", function () {
  const timer = pillTimer();
  if (timer && timer.done) { dismissTimer(timer.id); return; }
  go("#/timers");
});

// A timer that finished while the tab was hidden should announce itself the
// moment the tab comes back.
document.addEventListener("visibilitychange", function () {
  if (!document.hidden) tick();
});
</script>
<script>
/* ==========================================================================
   Library
   ========================================================================== */
"use strict";

const SORTS = [
  { id: "updated", label: "Recently updated" },
  { id: "created", label: "Recently added" },
  { id: "title",   label: "Name" },
  { id: "cooked",  label: "Most cooked" },
  { id: "time",    label: "Quickest first" }
];

const totalMinutes = function (r) { return (r.prep_minutes || 0) + (r.cook_minutes || 0); };

function matchesFilters(recipe) {
  const f = state.filters;
  if (f.favorite && !recipe.favorite) return false;
  if (f.tag && (recipe.tags || []).indexOf(f.tag) < 0 && recipe.category !== f.tag) return false;
  if (f.q) {
    const needle = f.q.toLowerCase();
    const hay = [recipe.title, recipe.summary, recipe.category, recipe.cuisine]
      .concat(recipe.tags || [])
      .concat((recipe.ingredients || []).map(function (i) { return i.item; }))
      .join(" ").toLowerCase();
    if (hay.indexOf(needle) < 0) return false;
  }
  return true;
}

function sortedRecipes(list) {
  const copy = list.slice();
  const sort = state.filters.sort;
  copy.sort(function (a, b) {
    if (sort === "title") return a.title.localeCompare(b.title);
    if (sort === "cooked") return (b.cooked_count || 0) - (a.cooked_count || 0);
    if (sort === "time") return totalMinutes(a) - totalMinutes(b);
    if (sort === "created") return String(b.created_at).localeCompare(String(a.created_at));
    return String(b.updated_at).localeCompare(String(a.updated_at));
  });
  return copy;
}

function recipeCard(recipe) {
  const time = totalMinutes(recipe);
  const favButton = el("button", {
    class: "card__fav", type: "button", "aria-pressed": String(!!recipe.favorite),
    "aria-label": (recipe.favorite ? "Remove " : "Add ") + recipe.title +
                  (recipe.favorite ? " from favourites" : " to favourites"),
    onclick: async function (event) {
      event.preventDefault();
      event.stopPropagation();
      try {
        await toggleFavorite(recipe);
        setContent(favButton, icon("heart", recipe.favorite ? "icon--filled" : null));
        favButton.setAttribute("aria-pressed", String(!!recipe.favorite));
        favButton.setAttribute("aria-label", (recipe.favorite ? "Remove " : "Add ") + recipe.title +
                               (recipe.favorite ? " from favourites" : " to favourites"));
        haptic();
      } catch (err) { reportError(err); }
    }
  }, icon("heart", recipe.favorite ? "icon--filled" : null));

  const media = el("div", { class: "card__media" }, [
    recipe.photo_id
      ? el("img", { src: photoUrl(recipe.photo_id), alt: "", loading: "lazy", decoding: "async" })
      : el("div", { class: "placeholder" }, icon("photo")),
    favButton
  ]);

  const meta = [];
  if (time) meta.push(el("span", { class: "badge" }, [icon("clock"), formatMinutes(time)]));
  if (recipe.servings) meta.push(el("span", { class: "badge" }, [icon("people"), String(recipe.servings)]));
  if (recipe.cooked_count) {
    meta.push(el("span", { class: "badge badge--tint" },
      [icon("flame"), plural(recipe.cooked_count, "cook", "cooks")]));
  }

  return el("div", { class: "card" }, [
    media,
    el("div", { class: "card__body" }, [
      el("span", { class: "card__title", text: recipe.title }),
      recipe.summary ? el("span", { class: "t-footnote secondary", text: recipe.summary }) : null,
      meta.length ? el("div", { class: "card__meta" }, meta) : null
    ]),
    el("a", { class: "card__link", href: "#/recipe/" + recipe.id, "aria-label": recipe.title })
  ]);
}

function openSortSheet() {
  openSheet({
    title: "Sort recipes",
    body: el("div", { class: "list" }, SORTS.map(function (option) {
      const active = state.filters.sort === option.id;
      return el("button", { class: "row", type: "button", onclick: function () {
        state.filters.sort = option.id;
        closeSheet();
        render();
      } }, [
        el("span", { class: "row__text" }, el("span", { class: "row__title", text: option.label })),
        active ? icon("check") : null
      ]);
    }))
  });
}

VIEWS.library = async function (main) {
  setTopbar({
    title: "Recipes",
    trailing: [
      el("button", { class: "iconbtn", type: "button", "aria-label": "Sort recipes", onclick: openSortSheet },
        icon("sort")),
      el("button", { class: "iconbtn", type: "button", "aria-label": "Add a recipe",
                     onclick: openImportSheet }, icon("plus"))
    ]
  });

  if (!state.loaded) {
    setContent(main, el("div", { class: "wrap" }, loadingView()));
    await refreshRecipes();
  }

  const wrap = el("div", { class: "wrap wrap--wide" });
  wrap.appendChild(el("h2", { class: "largetitle", text: "Recipes" }));

  const searchInput = el("input", {
    type: "search", value: state.filters.q, placeholder: "Search recipes and ingredients",
    "aria-label": "Search recipes and ingredients", enterkeyhint: "search"
  });
  let debounce = null;
  searchInput.addEventListener("input", function () {
    clearTimeout(debounce);
    debounce = setTimeout(function () {
      state.filters.q = searchInput.value.trim();
      paint();
      if (document.activeElement !== searchInput) searchInput.focus();
    }, 160);
  });
  wrap.appendChild(el("div", { class: "search", style: "margin-bottom:12px" },
    [icon("search"), searchInput]));

  const chipRow = el("div", { class: "chips", role: "group", "aria-label": "Filter recipes" });
  wrap.appendChild(chipRow);

  const results = el("div", { style: "margin-top:20px" });
  wrap.appendChild(results);
  setContent(main, wrap);

  function paint() {
    const chips = [
      el("button", {
        class: "chip", type: "button", "aria-pressed": String(!state.filters.favorite && !state.filters.tag),
        onclick: function () { state.filters.favorite = false; state.filters.tag = ""; paint(); }
      }, "All"),
      el("button", {
        class: "chip", type: "button", "aria-pressed": String(state.filters.favorite),
        onclick: function () { state.filters.favorite = !state.filters.favorite; paint(); }
      }, [icon("heart", state.filters.favorite ? "icon--filled" : null), "Favourites"])
    ].concat(allTags().map(function (tag) {
      return el("button", {
        class: "chip", type: "button", "aria-pressed": String(state.filters.tag === tag),
        onclick: function () { state.filters.tag = state.filters.tag === tag ? "" : tag; paint(); }
      }, tag);

    setContent(chipRow, chips);

    const list = sortedRecipes(state.recipes.filter(matchesFilters));
    if (!list.length) {
      setContent(results, emptyLibrary());
      return;

    setContent(results, [
      el("p", { class: "t-footnote secondary", style: "margin-bottom:12px",
                text: plural(list.length, "recipe", "recipes") }),
      el("div", { class: "cards" }, list.map(recipeCard))
    ]);
  }

  paint();

function emptyLibrary() {
  const filtering = state.filters.q || state.filters.tag || state.filters.favorite;
  if (filtering) {
    return el("div", { class: "empty" }, [
      icon("search"),
      el("p", { class: "empty__title", text: "No matches" }),
      el("p", { class: "empty__body", text: "Try a different word, or clear the filters." }),
      el("button", { class: "btn btn--tinted", type: "button", text: "Clear filters", onclick: function () {
        state.filters = { q: "", tag: "", favorite: false, sort: state.filters.sort };
        render();
      } })

  }
  return el("div", { class: "empty" }, [
    icon("book"),
    el("p", { class: "empty__title", text: "No recipes yet" }),
    el("p", { class: "empty__body",
              text: "Paste a link to a recipe page and it comes in whole \u2014 ingredients, " +
                    "method and photo \u2014 ready to edit. Or write one yourself." }),
    el("div", { style: "display:flex;gap:12px;flex-wrap:wrap;justify-content:center" }, [
      el("button", { class: "btn btn--filled", type: "button", onclick: openImportSheet },
        [icon("import"), "Import from a link"]),
      el("a", { class: "btn btn--tinted", href: "#/new" }, [icon("pencil"), "Write one"])
    ])
  ]);
}

<script>
/* ==========================================================================
   Recipe detail
   ========================================================================== */
"use strict";

const capitalise = function (s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ""; };

function ingredientLine(ing, scale) {
  const amount = ing.amount ? formatAmount(ing.amount * scale) : "";
  const rest = [ing.unit, ing.item].filter(Boolean).join(" ");
  return { amount: amount, text: rest, full: [amount, rest].filter(Boolean).join(" ") };
}

function checkedSet(recipeId) {
  if (!state.checked[recipeId]) state.checked[recipeId] = {};
  return state.checked[recipeId];
}

function ingredientList(recipe, scale) {
  const ticked = checkedSet(recipe.id);
  const nodes = [];
  let lastGroup = null;
  (recipe.ingredients || []).forEach(function (ing, index) {
    if (ing.group && ing.group !== lastGroup) {
      nodes.push(el("p", { class: "ing__group", text: ing.group }));
      lastGroup = ing.group;
    }
    const line = ingredientLine(ing, scale);
    nodes.push(el("button", {
      class: "ing", type: "button", "aria-pressed": String(!!ticked[index]),
      onclick: function (event) {
        ticked[index] = !ticked[index];
        event.currentTarget.setAttribute("aria-pressed", String(!!ticked[index]));
        writeStore(CHECKED_KEY, state.checked);
        haptic();
      }
    }, [
      el("span", { class: "ing__check" }, icon("check")),
      el("span", { class: "ing__text" }, [
        line.amount ? el("span", { class: "ing__amount", text: line.amount + " " }) : null,
        el("span", { text: line.text }),
        ing.note ? el("span", { class: "t-footnote secondary", text: " \u00B7 " + ing.note }) : null
      ])
    ]));
  });
  return nodes;
}

function recipePayload(recipe) {
  return {
    title: recipe.title, summary: recipe.summary, category: recipe.category, cuisine: recipe.cuisine,
    tags: recipe.tags || [], servings: recipe.servings, prep_minutes: recipe.prep_minutes,
    cook_minutes: recipe.cook_minutes, difficulty: recipe.difficulty, photo_id: recipe.photo_id,
    ingredients: recipe.ingredients || [], steps: recipe.steps || [], notes: recipe.notes,
    source: recipe.source, favorite: !!recipe.favorite
  };
}

async function toggleFavorite(recipe) {
  const next = Object.assign({}, recipe, { favorite: !recipe.favorite });
  const saved = await api("api/recipes/" + recipe.id, { method: "PUT", body: recipePayload(next) });
  Object.assign(recipe, saved);
  return saved;
}

async function addRecipeToShopping(recipe, scale) {
  const lines = (recipe.ingredients || []).map(function (ing) {
    return ingredientLine(ing, scale).full;
  }).filter(Boolean);
  for (let i = 0; i < lines.length; i++) {
    await api("api/shopping", { method: "POST", body: { text: lines[i], recipe: recipe.title } });
  }
  await refreshShopping();
  toast(plural(lines.length, "item", "items") + " added to the shopping list", "ok");
}

<script>
"use strict";

VIEWS.recipe = async function (main, params) {
  if (!state.loaded) {
    setContent(main, el("div", { class: "wrap" }, loadingView()));
    await refreshRecipes();
  }
  let recipe = findRecipe(params.id);
  if (!recipe) recipe = await api("api/recipes/" + params.id);

  const baseServings = recipe.servings || 1;
  let servings = baseServings;

  const favButton = el("button", {
    class: "iconbtn", type: "button", "aria-pressed": String(!!recipe.favorite),
    "aria-label": recipe.favorite ? "Remove from favourites" : "Add to favourites",
    onclick: async function () {
      try {
        await toggleFavorite(recipe);
        setContent(favButton, icon("heart", recipe.favorite ? "icon--filled" : null));
        favButton.setAttribute("aria-pressed", String(!!recipe.favorite));
        favButton.setAttribute("aria-label",
          recipe.favorite ? "Remove from favourites" : "Add to favourites");
        haptic();
      } catch (err) { reportError(err); }
    }
  }, icon("heart", recipe.favorite ? "icon--filled" : null));

  setTopbar({
    title: recipe.title,
    leading: backButton("#/recipes", "Back to recipes"),
    trailing: [
      favButton,
      el("a", { class: "iconbtn", href: "#/edit/" + recipe.id, "aria-label": "Edit recipe" }, icon("pencil"))
    ]
  });

  const wrap = el("div", { class: "wrap" });

  wrap.appendChild(el("div", { class: "hero" },
    el("div", { class: "hero__media" }, recipe.photo_id
      ? el("img", { src: photoUrl(recipe.photo_id), alt: "Photo of " + recipe.title })
      : el("div", { class: "placeholder" }, icon("photo")))));

  wrap.appendChild(el("h2", { class: "t-largetitle", text: recipe.title }));
  if (recipe.summary) {
    wrap.appendChild(el("p", { class: "t-callout secondary", style: "margin-top:8px", text: recipe.summary }));
  }

  const badges = [];
  if (recipe.prep_minutes) {
    badges.push(el("span", { class: "badge" }, [icon("clock"), "Prep " + formatMinutes(recipe.prep_minutes)]));
  }
  if (recipe.cook_minutes) {
    badges.push(el("span", { class: "badge" }, [icon("flame"), "Cook " + formatMinutes(recipe.cook_minutes)]));
  }
  if (recipe.difficulty) badges.push(el("span", { class: "badge", text: capitalise(recipe.difficulty) }));
  if (recipe.cuisine) badges.push(el("span", { class: "badge", text: recipe.cuisine }));
  if (recipe.cooked_count) {
    badges.push(el("span", { class: "badge badge--tint" },
      [icon("flame"), "Cooked " + plural(recipe.cooked_count, "time", "times")]));
  }
  if (badges.length) wrap.appendChild(el("div", { class: "meta-row" }, badges));

  const amountsHost = el("div", { class: "list" });
  const unitLabel = el("span", { class: "t-footnote secondary", text: "servings" });
  const repaint = function () {
    setContent(amountsHost, ingredientList(recipe, servings / baseServings));
    unitLabel.textContent = servings === 1 ? "serving" : "servings";
  };
  const servingsValue = el("span", {
    class: "stepper__value", text: String(servings), "aria-live": "polite",
    "aria-label": String(servings) + " servings"
  });
  const bump = function (delta) {
    const next = Math.min(99, Math.max(1, servings + delta));
    if (next === servings) return;
    servings = next;
    servingsValue.textContent = String(servings);
    servingsValue.setAttribute("aria-label", String(servings) + " servings");
    repaint();
  };

  wrap.appendChild(el("section", { class: "group" }, [
    el("div", { style: "display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px" }, [
      el("h3", { class: "t-title3", text: "Ingredients", style: "flex:1;min-width:8rem" }),
      el("div", { class: "stepper" }, [
        el("button", { type: "button", "aria-label": "Fewer servings",
                       onclick: function () { bump(-1); } },
          el("span", { text: "\u2212", "aria-hidden": "true", style: "font-size:1.25rem;font-weight:600" })),
        servingsValue,
        el("button", { type: "button", "aria-label": "More servings",
                       onclick: function () { bump(1); } },
          el("span", { text: "+", "aria-hidden": "true", style: "font-size:1.25rem;font-weight:600" }))
      ]),
      unitLabel
    ]),
    amountsHost,
    el("button", { class: "btn btn--tinted", style: "margin-top:12px", type: "button",
      onclick: async function () {
        try { await addRecipeToShopping(recipe, servings / baseServings); }
        catch (err) { reportError(err); }
      } }, [icon("cart"), "Add to shopping list"])
  ]));
  repaint();

  if ((recipe.steps || []).length) {
    wrap.appendChild(el("section", { class: "group" }, [
      el("h3", { class: "t-title3", style: "margin-bottom:12px", text: "Method" }),
      el("div", { class: "list" }, recipe.steps.map(function (step, index) {
        return el("div", { class: "step" }, [
          el("span", { class: "step__no", text: String(index + 1) }),
          el("div", { class: "step__body" }, [
            el("p", { text: step.text }),
            step.photo_id ? el("img", {
              src: photoUrl(step.photo_id), alt: "", loading: "lazy",
              style: "border-radius:12px;max-height:14rem;object-fit:cover;width:100%"
            }) : null,
            step.seconds ? el("button", {
              class: "btn btn--tinted", type: "button",
              onclick: function () {
                addTimer({
                  label: recipe.title + " \u00B7 step " + (index + 1),
                  seconds: step.seconds, recipeId: recipe.id, stepIndex: index
                });
                toast("Timer started for " + formatClock(step.seconds), "ok");
              }
            }, [icon("timer"), "Start " + formatClock(step.seconds)]) : null
          ])
        ]);
      }))
    ]));
  }

  if (recipe.notes) {
    wrap.appendChild(el("section", { class: "group" }, [
      el("h3", { class: "t-title3", style: "margin-bottom:12px", text: "Notes" }),
      el("div", { class: "list" },
        el("p", { style: "padding:16px;white-space:pre-wrap", text: recipe.notes }))
    ]));
  }

  const footer = [];
  if (recipe.source) {
    footer.push(el("p", { class: "t-footnote secondary" }, [
      "Source: ",
      /^https?:\/\//.test(recipe.source)
        ? el("a", { href: recipe.source, target: "_blank", rel: "noopener noreferrer", text: recipe.source })
        : recipe.source
    ]));
  }
  if (recipe.last_cooked_at) {
    footer.push(el("p", { class: "t-footnote secondary",
                          text: "Last cooked " + formatDate(recipe.last_cooked_at) }));
  }
  footer.push(el("button", {
    class: "btn btn--gray", type: "button", style: "margin-top:8px",
    onclick: async function () {
      const copy = recipePayload(recipe);
      copy.title = recipe.title + " (copy)";
      copy.favorite = false;
      try {
        const made = await api("api/recipes", { method: "POST", body: copy });
        state.recipes.unshift(made);
        toast("Duplicated \u2014 edit the copy", "ok");
        go("#/edit/" + made.id);
      } catch (err) { reportError(err); }
    }
  }, [icon("export"), "Duplicate"]));
  footer.push(el("button", {
    class: "btn btn--danger", type: "button", style: "margin-top:8px",
    onclick: async function () {
      const ok = await confirmAction({
        title: "Delete this recipe?",
        message: recipe.title + " will be removed permanently. This cannot be undone.",
        confirmLabel: "Delete recipe", destructive: true
      });
      if (!ok) return;
      const restore = recipePayload(recipe);
      try {
        await api("api/recipes/" + recipe.id, { method: "DELETE" });
        state.recipes = state.recipes.filter(function (r) { return r.id !== recipe.id; });
        go("#/recipes");
        toast("Deleted " + recipe.title, "ok", {
          label: "Undo",
          onAction: async function () {
            try {
              const back = await api("api/recipes", { method: "POST", body: restore });
              state.recipes.unshift(back);
              toast("Restored", "ok");
              go("#/recipe/" + back.id);
            } catch (err) { reportError(err); }
          }
        });
      } catch (err) { reportError(err); }
    }
  }, [icon("trash"), "Delete recipe"]));
  wrap.appendChild(el("section", { class: "group" }, footer));

  wrap.appendChild(el("div", { style: "height:76px" }));
  setContent(main, wrap);

  // The primary action of the screen, and the only tinted fill on it.
  main.appendChild(el("a", {
    class: "btn btn--filled btn--large", href: "#/cook/" + recipe.id,
    style: "position:fixed;left:50%;transform:translateX(-50%);z-index:50;" +
           "bottom:calc(var(--tabbar-h) + var(--safe-b) + 16px);" +
           "width:min(24rem,calc(100vw - 2rem));box-shadow:0 6px 24px rgba(0,0,0,.28)"
  }, [icon("play"), "Start cooking"]));
};

<script>
/* ==========================================================================
   Photo picker
   Three ways to get a picture: a file from the device, the camera, or a
   search across free photo sources. Whatever is chosen is copied to this
   server, so a recipe never depends on someone else's URL staying up.
   ========================================================================== */
"use strict";

async function uploadFile(file) {
  if (!file) return null;
  const form = new FormData();
  form.append("file", file);
  return api("api/photos", { method: "POST", body: form });
}

function pickPhoto(suggestedQuery) {
  return new Promise(function (resolve) {
    let settled = false;
    const finish = function (value) {
      if (settled) return;
      settled = true;
      resolve(value);
      closeSheet();
    };

    const panel = el("div", { style: "min-height:16rem" });
    const busy = function (message) {
      setContent(panel, el("div", { class: "loading" },
        [el("div", { class: "spinner" }), el("span", { text: message })]));
    };

    const fileInput = el("input", { type: "file", accept: "image/*", class: "visually-hidden",
      onchange: async function (event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        busy("Uploading");
        try { finish(await uploadFile(file)); }
        catch (err) { reportError(err); showTab("device"); }
      } });
    const cameraInput = el("input", { type: "file", accept: "image/*", capture: "environment",
      class: "visually-hidden",
      onchange: async function (event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        busy("Uploading");
        try { finish(await uploadFile(file)); }
        catch (err) { reportError(err); showTab("device"); }
      } });

    let searchTimer = null;
    const searchField = el("input", {
      type: "search", placeholder: "Search for a photo", value: suggestedQuery || "",
      "aria-label": "Search for a photo", enterkeyhint: "search"
    });

    async function runSearch() {
      const q = searchField.value.trim();
      if (q.length < 2) {
        setContent(resultsHost, el("p", { class: "t-footnote secondary", style: "padding:16px 0",
          text: "Type at least two letters to search." }));
        return;
      }
      setContent(resultsHost, el("div", { class: "loading" },
        [el("div", { class: "spinner" }), el("span", { text: "Searching" })]));
      try {
        const data = await api("api/photos/search?q=" + encodeURIComponent(q));
        if (!data.results.length) {
          setContent(resultsHost, el("div", { class: "empty" }, [
            icon("photo"),
            el("p", { class: "empty__title", text: "Nothing found" }),
            el("p", { class: "empty__body", text: "Try a simpler word, like the main ingredient." })
          ]));
          return;
        }
        setContent(resultsHost, [
          el("div", { class: "photo-grid" }, data.results.map(function (item) {
            return el("button", {
              type: "button", title: item.attribution || item.title,
              "aria-label": "Use photo: " + (item.title || "untitled") +
                            (item.author ? ", by " + item.author : ""),
              onclick: async function () {
                busy("Saving photo");
                try {
                  finish(await api("api/photos/import", { method: "POST", body: {
                    url: item.url, attribution: item.attribution, link: item.link, source: item.provider
                  } }));
                } catch (err) { reportError(err); showTab("search"); }
              }
            }, [
              el("img", { src: item.thumb, alt: "", loading: "lazy", decoding: "async" }),
              el("figcaption", { text: item.author ? item.author + " \u00B7 " + item.provider : item.provider })
            ]);
          })),
          el("p", { class: "t-caption secondary", style: "margin-top:12px" },
            "Photos come from Openverse, Wikimedia Commons and TheMealDB. The credit line is " +
            "stored with the picture." ),
          data.unavailable && data.unavailable.length
            ? el("p", { class: "t-caption secondary", style: "margin-top:4px",
                        text: "Unavailable right now: " + data.unavailable.join(", ") })
            : null
        ]);
      } catch (err) {
        setContent(resultsHost, el("div", { class: "empty" }, [
          icon("warn"),
          el("p", { class: "empty__title", text: "Search is unavailable" }),
          el("p", { class: "empty__body", text: err.message })
        ]));
      }
    }

    searchField.addEventListener("input", function () {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(runSearch, 420);
    });
    const resultsHost = el("div", { style: "margin-top:12px" });
    const searchBar = el("div", { class: "search" }, [icon("search"), searchField]);

    function showTab(which) {
      Array.prototype.forEach.call(segmented.children, function (button) {
        button.setAttribute("aria-pressed", String(button.dataset.tab === which));
      });
      if (which === "search") {
        setContent(panel, [searchBar, resultsHost]);
        setTimeout(function () { searchField.focus(); }, 40);
        if (searchField.value.trim().length >= 2 && !resultsHost.firstChild) runSearch();
        return;
      }
      const isCamera = which === "camera";
      setContent(panel, el("div", { class: "empty" }, [
        icon(isCamera ? "camera" : "photo"),
        el("p", { class: "empty__title", text: isCamera ? "Take a photo" : "Choose a photo" }),
        el("p", { class: "empty__body", text: isCamera
          ? "Opens the camera on a phone or tablet."
          : "Pick a picture already on this device." }),
        el("button", { class: "btn btn--filled", type: "button",
          onclick: function () { (isCamera ? cameraInput : fileInput).click(); } },
          [icon(isCamera ? "camera" : "photo"), isCamera ? "Open camera" : "Choose file"])
      ]));
    }

    const segmented = el("div", { class: "segmented", role: "group", "aria-label": "Photo source" }, [
      el("button", { type: "button", dataset: { tab: "device" }, text: "Device",
                     onclick: function () { showTab("device"); } }),
      el("button", { type: "button", dataset: { tab: "camera" }, text: "Camera",
                     onclick: function () { showTab("camera"); } }),
      el("button", { type: "button", dataset: { tab: "search" }, text: "Search",
                     onclick: function () { showTab("search"); } })
    ]);

    openSheet({
      title: "Add a photo",
      onClose: function () { finish(null); },
      body: [segmented, fileInput, cameraInput, panel]
    });
    showTab(suggestedQuery ? "search" : "device");
  });
}
</script>
<script>
/* ==========================================================================
   Starting a recipe from a draft
   ========================================================================== */
"use strict";

function openImportSheet() {
  const resultsHost = el("div", { style: "margin-top:12px" });
  const field = el("input", {
    type: "search", placeholder: "Search by dish name", "aria-label": "Search by dish name",
    enterkeyhint: "search"
  });
  let debounceId = null;

  async function search() {
    const q = field.value.trim();
    if (q.length < 2) { clear(resultsHost); return; }
    setContent(resultsHost, el("div", { class: "loading" },
      [el("div", { class: "spinner" }), el("span", { text: "Searching" })]));
    try {
      const data = await api("api/import/search?q=" + encodeURIComponent(q));
      if (!data.results.length) {
        setContent(resultsHost, el("div", { class: "empty" }, [
          icon("search"),
          el("p", { class: "empty__title", text: "Nothing found" }),
          el("p", { class: "empty__body", text: "Try the dish name on its own, such as goulash." })
        ]));
        return;
      }
      setContent(resultsHost, el("div", { class: "list" }, data.results.map(function (item) {
        return el("button", { class: "row", type: "button", onclick: function () { runImport(item); } }, [
          el("img", { src: item.thumb, alt: "", loading: "lazy",
                      style: "width:56px;height:56px;border-radius:10px;object-fit:cover;flex:0 0 auto" }),
          el("span", { class: "row__text" }, [
            el("span", { class: "row__title", text: item.title }),
            el("span", { class: "row__sub",
                         text: [item.cuisine, item.category].filter(Boolean).join(" \u00B7 ") })
          ]),
          icon("fwd", "row__chevron")
        ]);
      })));
    } catch (err) {
      setContent(resultsHost, el("div", { class: "empty" }, [
        icon("warn"),
        el("p", { class: "empty__title", text: "Search is unavailable" }),
        el("p", { class: "empty__body", text: err.message })
      ]));
    }
  }

  async function runImport(item) {
    setContent(resultsHost, el("div", { class: "loading" },
      [el("div", { class: "spinner" }), el("span", { text: "Importing " + item.title })]));
    try {
      const recipe = await api("api/import/mealdb/" + item.id, { method: "POST" });
      state.recipes.unshift(recipe);
      closeSheet();
      toast("Imported. Check it over and make it yours.", "ok");
      go("#/edit/" + recipe.id);
    } catch (err) {
      reportError(err);
      search();
    }
  }

  field.addEventListener("input", function () {
    clearTimeout(debounceId);
    debounceId = setTimeout(search, 420);
  });

  /* Importing from a link is the way most recipes actually arrive, so it
     leads; the recipe database is the fallback for when there is no link. */
  const linkField = el("input", {
    class: "field", type: "url", inputmode: "url", placeholder: "https://...",
    "aria-label": "Address of the recipe page", enterkeyhint: "go"
  });
  const linkStatus = el("div", { style: "margin-top:12px" });

  async function importLink() {
    const url = linkField.value.trim();
    if (!url) { toast("Paste a link first", "error"); linkField.focus(); return; }
    setContent(linkStatus, el("div", { class: "loading" },
      [el("div", { class: "spinner" }), el("span", { text: "Reading the page" })]));
    try {
      const recipe = await api("api/import/url", { method: "POST", body: { url: url } });
      state.recipes.unshift(recipe);
      closeSheet();
      toast("Imported. Check it over and make it yours.", "ok");
      go("#/edit/" + recipe.id);
    } catch (err) {
      setContent(linkStatus, el("div", { class: "empty" }, [
        icon("warn"),
        el("p", { class: "empty__title", text: "Could not import that" }),
        el("p", { class: "empty__body", text: err.message })
      ]));
    }
  }

  linkField.addEventListener("keydown", function (event) {
    if (event.key === "Enter") { event.preventDefault(); importLink(); }
  });

  const linkPanel = el("div", null, [
    el("p", { class: "t-footnote secondary", style: "padding:0 0 12px" },
      "Paste the address of a recipe page. Most recipe sites publish their " +
      "ingredients and method in a form this can read, photo included."),
    linkField,
    el("button", { class: "btn btn--filled btn--block", style: "margin-top:12px",
                   type: "button", onclick: importLink }, [icon("import"), "Import"]),
    linkStatus
  ]);

  const searchPanel = el("div", null, [
    el("p", { class: "t-footnote secondary", style: "padding:0 0 12px" },
      "Search a free recipe database and pull one in to edit. Nothing is published back."),
    el("div", { class: "search" }, [icon("search"), field]),
    resultsHost
  ]);

  const panel = el("div", { style: "min-height:12rem" });
  const tabs = el("div", { class: "segmented", role: "group", "aria-label": "Where to import from" }, [
    el("button", { type: "button", text: "From a link", dataset: { tab: "link" },
                   onclick: function () { showPanel("link"); } }),
    el("button", { type: "button", text: "Search", dataset: { tab: "search" },
                   onclick: function () { showPanel("search"); } })
  ]);

  function showPanel(which) {
    Array.prototype.forEach.call(tabs.children, function (button) {
      button.setAttribute("aria-pressed", String(button.dataset.tab === which));
    });
    setContent(panel, which === "link" ? linkPanel : searchPanel);
    setTimeout(function () { (which === "link" ? linkField : field).focus(); }, 60);
  }

  openSheet({
    title: "Add a recipe",
    body: [tabs, panel],
    footer: el("button", { class: "btn btn--gray btn--block", type: "button",
      onclick: function () { closeSheet(); go("#/new"); } },
      [icon("pencil"), "Write one from scratch"])
  });
  showPanel("link");
}

/* Paste a block of text and get one line per ingredient or step, so a recipe
   copied from a message or a website does not have to be retyped. */
function openPasteSheet(kind, onParsed) {
  const area = el("textarea", {
    class: "field", rows: "10",
    placeholder: kind === "ingredients"
      ? "200 g spaghetti\n100 g pancetta\n2 eggs"
      : "Boil the water.\nFry the pancetta for 5 minutes.\nMix and serve."
  });
  openSheet({
    title: kind === "ingredients" ? "Paste ingredients" : "Paste method",
    body: [
      el("p", { class: "t-footnote secondary", style: "padding:0 0 12px",
                text: "One per line. Amounts and units are picked out automatically." }),
      area
    ],
    footer: el("button", { class: "btn btn--filled btn--block", type: "button", text: "Add lines",
      onclick: function () {
        const lines = area.value.split("\n").map(function (l) { return l.trim(); }).filter(Boolean);
        closeSheet();
        if (lines.length) onParsed(lines);
      } })
  });
  setTimeout(function () { area.focus(); }, 60);
}

const UNITS = ["g", "kg", "ml", "l", "dl", "tsp", "tbsp", "cup", "cups", "clove", "cloves",
               "slice", "slices", "pinch", "can", "cans", "tin", "tins", "pack", "packs", "piece", "pieces"];

// "200 g spaghetti" -> { amount: 200, unit: "g", item: "spaghetti" }
function parseIngredientLine(line) {
  const match = line.match(/^\s*(\d+(?:[.,]\d+)?(?:\s*\/\s*\d+)?)\s*(.*)$/);
  if (!match) return { amount: null, unit: "", item: line, note: "", group: "" };
  let amount = null;
  const raw = match[1].replace(",", ".");
  if (raw.indexOf("/") >= 0) {
    const bits = raw.split("/");
    amount = parseFloat(bits[0]) / parseFloat(bits[1]);
  } else {
    amount = parseFloat(raw);
  }
  let rest = match[2].trim();
  let unit = "";
  const firstWord = rest.split(/\s+/)[0] || "";
  if (UNITS.indexOf(firstWord.toLowerCase().replace(/\.$/, "")) >= 0) {
    unit = firstWord.replace(/\.$/, "");
    rest = rest.slice(firstWord.length).trim();
  }
  return { amount: isNaN(amount) ? null : Math.round(amount * 1000) / 1000,
           unit: unit, item: rest, note: "", group: "" };
}

// Mirrors the server-side detection so a pasted step gets its timer too.
function detectSeconds(text) {
  const match = text.match(/(\d+)\s*(?:-|to|\u2013)?\s*(\d+)?\s*(hours?|hrs?|minutes?|mins?|seconds?|secs?)\b/i);
  if (!match) return 0;
  const value = parseInt(match[2] || match[1], 10);
  const unit = match[3].toLowerCase();
  if (unit.charAt(0) === "h") return value * 3600;
  if (unit.charAt(0) === "m") return value * 60;
  return value;
}

<script>
/* ==========================================================================
   Editor
   ========================================================================== */
"use strict";

const DIFFICULTIES = ["easy", "medium", "hard"];

function blankRecipe() {
  return {

<script>
/* ==========================================================================
   Cooking mode
   A separate environment for the few minutes when hands are busy: one step
   at a time, large type, wide targets, the screen kept awake.
   ========================================================================== */
"use strict";

let cookSession = null;
let wakeLock = null;

async function requestWakeLock() {
  if (!state.prefs.keepAwake || !navigator.wakeLock) return;
  try { wakeLock = await navigator.wakeLock.request("screen"); }
  catch (err) { wakeLock = null; }
}

function releaseWakeLock() {
  if (wakeLock) { try { wakeLock.release(); } catch (err) { /* already gone */ } }
  wakeLock = null;
}

// A wake lock is dropped when the tab is hidden, so it has to be retaken.
document.addEventListener("visibilitychange", function () {
  if (!document.hidden && cookSession && !wakeLock) requestWakeLock();
});

async function openCook(recipeId) {
  const recipe = findRecipe(recipeId) || await api("api/recipes/" + recipeId);
  const steps = (recipe.steps || []).filter(function (s) { return (s.text || "").trim(); });

  /* Cooking gets interrupted - the phone locks, someone rings the doorbell.
     Coming back should not mean hunting for where you were. */
  const saved = readStore(COOKING_KEY, null);
  let startAt = 0;
  let resumed = false;
  if (saved && saved.recipeId === recipe.id &&
      saved.index > 0 && saved.index < steps.length) {
    startAt = saved.index;
    resumed = true;
  }
  cookSession = { recipe: recipe, steps: steps, index: startAt, finished: false };

  const host = $("#cook");
  host.hidden = false;
  host.classList.add("is-open");
  document.body.style.overflow = "hidden";
  updatePill();
  requestWakeLock();
  unlockAudio();
  paintCook();
  host.focus();
  if (resumed) {
    toast("Picked up at step " + (startAt + 1), null, {
      label: "Start over",
      onAction: function () {
        if (!cookSession) return;
        cookSession.index = 0;
        cookSession.finished = false;
        writeStore(COOKING_KEY, { recipeId: recipe.id, index: 0 });
        paintCook();
      }
    });
  }
}

function closeCook(silent) {
  const host = $("#cook");
  if (!host.classList.contains("is-open")) return;
  host.classList.remove("is-open");
  host.hidden = true;
  clear(host);
  document.body.style.overflow = "";
  releaseWakeLock();
  const session = cookSession;
  cookSession = null;
  updatePill();
  if (!silent && session) go("#/recipe/" + session.recipe.id, true);
}

function cookGo(delta) {
  if (!cookSession) return;
  const next = cookSession.index + delta;
  if (next < 0) return;
  if (next >= cookSession.steps.length) { cookSession.finished = true; paintCook(); return; }
  cookSession.index = next;
  cookSession.finished = false;
  writeStore(COOKING_KEY, { recipeId: cookSession.recipe.id, index: next });
  paintCook();
  const body = $(".cook__body");
  if (body) body.scrollTop = 0;
}

document.addEventListener("keydown", function (event) {
  if (!cookSession) return;
  if (event.target && /^(INPUT|TEXTAREA)$/.test(event.target.tagName)) return;
  if (event.key === "ArrowRight") { event.preventDefault(); cookGo(1); }
  if (event.key === "ArrowLeft") { event.preventDefault(); cookGo(-1); }
});
</script>
