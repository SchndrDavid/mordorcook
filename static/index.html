    el("button", { class: "iconbtn iconbtn--neutral", type: "button", "aria-label": "Reset timer",
                   onclick: function () { resetTimer(existing.id); paintCook(); } }, icon("reset")),
    el("button", { class: "iconbtn iconbtn--neutral", type: "button", "aria-label": "Remove timer",
                   onclick: function () { removeTimer(existing.id); paintCook(); } }, icon("x"))
  ]);
}

async function finishCooking() {
  const recipe = cookSession.recipe;
  try {
    const updated = await api("api/recipes/" + recipe.id + "/cooked", { method: "POST" });
    const index = state.recipes.findIndex(function (r) { return r.id === updated.id; });
    if (index >= 0) state.recipes[index] = updated;
    toast("Logged. That is " + plural(updated.cooked_count, "cook", "cooks") + ".", "ok");
  } catch (err) {
    reportError(err);
  }
  // Timers belonging to this session have served their purpose.
  timers = timers.filter(function (t) { return t.recipeId !== recipe.id; });
  persistTimers();
  state.checked[recipe.id] = {};
  writeStore(CHECKED_KEY, state.checked);
  writeStore(COOKING_KEY, null);
  closeCook();
}
</script>
<script>
"use strict";

function paintCook() {
  const host = $("#cook");
  const session = cookSession;
  if (!session) return;
  const recipe = session.recipe;
  const total = session.steps.length;

  const bar = el("div", { class: "cook__bar" }, [
    el("button", { class: "iconbtn", type: "button", "aria-label": "Leave cooking mode",
                   onclick: function () { closeCook(); } }, icon("x")),
    el("span", { class: "cook__count", "aria-live": "polite",
                 text: session.finished ? "Finished" : "Step " + (session.index + 1) + " of " + total }),
    el("span", { class: "iconbtn", "aria-hidden": "true" })
  ]);

  const done = session.finished ? 1 : total ? (session.index + 1) / total : 1;
  const progress = el("div", { class: "cook__progress", role: "progressbar",
    "aria-valuemin": "0", "aria-valuemax": String(total),
    "aria-valuenow": String(session.finished ? total : session.index + 1),
    "aria-label": "Cooking progress"
  }, el("div", { style: "width:" + Math.round(done * 100) + "%" }));

  let inner;
  if (session.finished || !total) {
    inner = el("div", { class: "cook__inner" }, el("div", { class: "cook__done" }, [
      icon("check"),
      el("h2", { class: "t-title1", text: "All done" }),
      el("p", { class: "secondary", text: recipe.title + " is ready." }),
      el("button", { class: "btn btn--filled btn--large btn--block", type: "button",
                     onclick: finishCooking }, [icon("flame"), "Log this cook"]),
      el("button", { class: "btn btn--gray btn--block", type: "button", text: "Close without logging",
                     onclick: function () { closeCook(); } })
    ]));
  } else {
    const step = session.steps[session.index];
    inner = el("div", { class: "cook__inner" }, [
      el("p", { class: "cook__stepno", text: "Step " + (session.index + 1) }),
      el("p", { class: "cook__step", text: step.text }),
      step.photo_id ? el("div", { class: "cook__photo" },
        el("img", { src: photoUrl(step.photo_id), alt: "" })) : null,
      step.seconds ? stepTimerBlock(step, session.index) : null,
      el("button", { class: "btn btn--gray btn--block", type: "button", onclick: cookIngredientsSheet },
        [icon("cart"), "Check the ingredients"])
    ]);
  }

  const nav = session.finished ? null : el("div", { class: "cook__nav" }, [
    el("button", { class: "btn btn--gray", type: "button", disabled: session.index === 0 ? true : null,
                   onclick: function () { cookGo(-1); } }, [icon("back"), "Back"]),
    el("button", { class: "btn btn--filled", type: "button", onclick: function () { cookGo(1); } },
      [session.index + 1 >= total ? "Finish" : "Next", icon("fwd")])
  ]);

  setContent(host, [bar, progress, el("div", { class: "cook__body" }, inner), nav]);
  host.setAttribute("aria-label", "Cooking " + recipe.title);
  attachSwipe(host.querySelector(".cook__body"));
}

/* A horizontal swipe moves between steps. Every swipe has a button that does
   the same thing, so nothing depends on the gesture. */
function attachSwipe(node) {
  if (!node) return;
  let startX = 0;
  let startY = 0;
  let tracking = false;
  node.addEventListener("pointerdown", function (event) {
    if (event.pointerType === "mouse") return;
    tracking = true;
    startX = event.clientX;
    startY = event.clientY;
  });
  node.addEventListener("pointerup", function (event) {
    if (!tracking) return;
    tracking = false;
    const dx = event.clientX - startX;
    const dy = event.clientY - startY;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    cookGo(dx < 0 ? 1 : -1);
    haptic();
  });
  node.addEventListener("pointercancel", function () { tracking = false; });
}
</script>

VIEWS.shopping = async function (main) {

                              "aria-label": "Add an item", enterkeyhint: "done" });

  async function add() {
    const text = field.value.trim();

      await api("api/shopping", { method: "POST", body: { text: text, recipe: "" } });
      await refreshShopping();
      paint();
      field.focus();
    } catch (err) { reportError(err); }

  field.addEventListener("keydown", function (event) {

<script>
/* ==========================================================================
   Start up
   ========================================================================== */
"use strict";

applyPrefs();
loadTimers();
watchScroll();
updateTimerViews();

function updateConnection(wasOffline) {
  const bar = $("#offlineBar");
  if (navigator.onLine) {
    bar.hidden = true;
    clear(bar);
    // Whatever failed while the connection was down is worth retrying now.
    if (wasOffline) render().catch(reportError);
    return;
  }
  bar.hidden = false;
  setContent(bar, [icon("warn"), el("span", { text: "Offline \u2014 changes cannot be saved" })]);
}

window.addEventListener("offline", function () { updateConnection(false); });
window.addEventListener("online", function () { updateConnection(true); });
updateConnection(false);

// The first tap anywhere unlocks audio, so a timer chime is not silently
// swallowed by the browser's autoplay rules later on.
document.addEventListener("pointerdown", function once() {
  unlockAudio();
  document.removeEventListener("pointerdown", once);
}, { once: true });

/* Offline caching needs a secure context, which a plain http:// address on a
   private network is not. Registering it there would fail on every load, so it
   is attempted only where the browser allows it; everywhere else the app just
   needs the network, exactly as before. */
if ("serviceWorker" in navigator && window.isSecureContext) {
  navigator.serviceWorker.register(BASE + "sw.js", { scope: BASE })
    .catch(function (err) {
      // Never fatal, but silence here cost an afternoon once already.
      console.warn("Offline support unavailable:", err && err.message);
    });
}

render().catch(reportError);
</script>
